name: Coverage Badge

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-badge
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Cache bun deps
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Keep parity with CI's unit shard: several default-suite tests shell out
      # to ghq even when the behavior under test is mocked.
      # kobo-193: pinned prebuilt binary (see ci.yml) — `go install …@latest`
      # dragged in go1.26.5 via GOTOOLCHAIN=auto → 404 → setup failed fleet-wide.
      - name: Install ghq
        run: |
          GHQ_VERSION=v1.6.2
          curl -fsSL -o /tmp/ghq.zip "https://github.com/x-motemen/ghq/releases/download/${GHQ_VERSION}/ghq_linux_amd64.zip"
          unzip -q -o /tmp/ghq.zip -d /tmp/ghq
          mkdir -p "$HOME/bin"
          install -m 0755 /tmp/ghq/ghq_linux_amd64/ghq "$HOME/bin/ghq"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/ghq" --version

      - name: Generate coverage badge endpoint JSON
        env:
          MAW_SKIP_FLAKY: "1"
        run: bun run test:coverage

      - name: Update coverage gist
        env:
          GH_TOKEN: ${{ secrets.COVERAGE_GIST_TOKEN }}
          COVERAGE_GIST_ID: b00c729c7f40d4804f82011167bfd9d8
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::notice title=Coverage badge not published::Set COVERAGE_GIST_TOKEN with gist scope to update ${COVERAGE_GIST_ID}."
            exit 0
          fi
          gh gist edit "$COVERAGE_GIST_ID" --filename maw-js-coverage.json coverage/maw-js-coverage.json
          echo "### Coverage badge updated" >> "$GITHUB_STEP_SUMMARY"
          cat coverage/maw-js-coverage.json >> "$GITHUB_STEP_SUMMARY"
