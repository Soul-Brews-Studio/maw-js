<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>maw share</title>
    <style>
      html,
      body {
        margin: 0;
        background: #0d0d0d;
        color: #d1d5db;
        height: 100%;
      }

      #fallback {
        font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        padding: 12px;
        white-space: pre-wrap;
      }

      #term {
        width: 100%;
        height: 100%;
      }

      xterm-host, #xterm {
        width: 100%;
        height: 100%;
      }
    </style>
    <script src="https://unpkg.com/@xterm/xterm/lib/xterm.js"></script>
    <script src="https://unpkg.com/@xterm/addon-fit/lib/addon-fit.js"></script>
  </head>
  <body>
    <div id="fallback" style="display:none;">xterm.js failed to load; falling back to static display.</div>
    <div id="term"></div>
    <pre id="ansi-fallback" style="display:none; margin:0;"></pre>

    <script>
      (() => {
        const match = location.pathname.match(/\/share\/([^/?#]+)/);
        const slug = match?.[1] || "";
        const params = new URLSearchParams(location.hash?.replace(/^#/, "") || "");
        const token = params.get("t") || params.get("token") || "";
        const e2eKey = params.get("k") || "";
        const wsToken = e2eKey || token;
        const wsProto = location.protocol === "https:" ? "wss" : "ws";
        const socket = new WebSocket(`${wsProto}://${location.host}/ws/share/${encodeURIComponent(slug)}?${e2eKey ? "k" : "t"}=${encodeURIComponent(wsToken)}`);
        socket.binaryType = "arraybuffer";


        const b64urlToBytes = (value) => {
          const base64 = value.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((value.length + 3) % 4);
          const binary = atob(base64);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
          return bytes;
        };

        const deriveE2EKey = async (secret) => {
          if (!secret) return null;
          const ikm = b64urlToBytes(secret);
          const baseKey = await crypto.subtle.importKey("raw", ikm, "HKDF", false, ["deriveKey"]);
          return await crypto.subtle.deriveKey(
            {
              name: "HKDF",
              hash: "SHA-256",
              salt: new TextEncoder().encode("maw-share-e2e-hkdf-salt/v1"),
              info: new TextEncoder().encode("maw-share-e2e/aes-256-gcm/v1"),
            },
            baseKey,
            { name: "AES-GCM", length: 256 },
            false,
            ["decrypt"],
          );
        };

        const decryptFrame = async (key, data) => {
          if (!key) return typeof data === "string" ? data : new TextDecoder().decode(data);
          const bytes = data instanceof ArrayBuffer ? new Uint8Array(data) : new Uint8Array(await data.arrayBuffer());
          if (bytes[0] !== 0x4d || bytes[1] !== 0x53 || bytes[2] !== 0x31) throw new Error("invalid encrypted frame");
          const nonce = bytes.slice(3, 15);
          const ciphertextAndTag = bytes.slice(15);
          const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: nonce }, key, ciphertextAndTag);
          return new TextDecoder().decode(plain);
        };

        let e2eKeyPromise = deriveE2EKey(e2eKey);

        const fallback = document.getElementById("fallback");
        const termHost = document.getElementById("term");
        const pre = document.getElementById("ansi-fallback");

        const writeFallback = (chunk) => {
          pre.textContent += chunk;
          pre.parentElement?.appendChild(pre);
          pre.style.display = "block";
          termHost.style.display = "none";
        };

        const initTerminal = () => {
          if (!window.Terminal || !window.FitAddon) {
            fallback.textContent = "xterm.js unavailable; using fallback terminal.";
            fallback.style.display = "block";
            return false;
          }

          const term = new window.Terminal({
            theme: { background: "#0d0d0d", foreground: "#d1d5db" },
            convertEol: true,
            disableStdin: true,
            cursorBlink: false,
          });

          const fit = new window.FitAddon.FitAddon();
          term.loadAddon(fit);
          term.open(termHost);
          const resize = () => {
            try { fit.fit(); } catch { /* resize is advisory */ }
          };
          window.addEventListener("resize", resize);
          resize();

          socket.addEventListener("message", (event) => {
            void (async () => {
              try {
                term.write(await decryptFrame(await e2eKeyPromise, event.data));
              } catch {
                fallback.textContent = "Unable to decrypt encrypted share frame.";
                fallback.style.display = "block";
              }
            })();
          });
          return true;
        };

        if (!initTerminal()) {
          socket.addEventListener("message", (event) => {
            void (async () => {
              try {
                writeFallback(await decryptFrame(await e2eKeyPromise, event.data));
              } catch {
                writeFallback("\n[unable to decrypt encrypted share frame]\n");
              }
            })();
          });
        }

        socket.addEventListener("open", () => {
          try {
            socket.send("ping");
          } catch {
            // ignore
          }
        });

        socket.addEventListener("close", () => {
          // read-only: nothing to do
        });

        socket.addEventListener("error", () => {
          if (fallback.style.display === "none") {
            fallback.textContent = "Connection error while opening share.";
            fallback.style.display = "block";
          }
        });
      })();
    </script>
  </body>
</html>
