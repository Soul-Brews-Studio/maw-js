[test]
pathIgnorePatterns = ["**/agents/**", "agents/**"]
testPathIgnorePatterns = ["**/agents/**", "agents/**"]
# kobo-405: fail-closed for real `maw hey` delivery under ANY `bun test` run —
# see test/helpers/hey-spawn-fail-closed.ts for why this can't be env-var-gated.
# Lives under test/helpers/ (not test/setup/, not test/ root) deliberately —
# that directory is the one already excluded from test-default-safe.sh's
# git-ls-files glob (mirrors mock-tmux.ts/mock-ssh.ts/mock-config.ts there),
# so it can never be handed to `bun test` as a mismatched filename filter.
preload = ["./test/helpers/hey-spawn-fail-closed.ts"]
